name: docker-cloud

# Toutes les valeurs ${...} viennent du fichier .env (lu automatiquement par compose)

services:
  # API qui renvoie la phrase
  back:
    build:
      context: ./Backend
      args:                           # ARG du Dockerfile (build)
        ALPINE_VERSION: ${ALPINE_VERSION}
        PORT: ${BACK_PORT}
    image: docker-cloud/back
    environment:                      # ENV du Dockerfile surchargées (run)
      PORT: ${BACK_PORT}
      NODE_MAX_MEMORY: ${BACK_NODE_MAX_MEMORY}   # tas Node (Mo), sous la limite mémoire
      PHRASE: ${BACK_PHRASE}
      TZ: ${TZ}
    deploy:
      resources:
        limits:
          cpus: "${BACK_CPUS}"
          memory: ${BACK_MEMORY}
        reservations:
          memory: ${BACK_MEMORY_RESERVATION}
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - interne

  # Passerelle d'API (nginx) : liaison front -> back, joignable seulement en interne
  gateway:
    build:
      context: ./Gateway
      args:
        ALPINE_VERSION: ${ALPINE_VERSION}
        PORT: ${GATEWAY_PORT}
    image: docker-cloud/gateway
    environment:
      PORT: ${GATEWAY_PORT}
      WORKER_PROCESSES: ${GATEWAY_WORKER_PROCESSES}   # aligné sur la limite CPU
      WORKER_CONNECTIONS: ${GATEWAY_WORKER_CONNECTIONS}
      BACK_HOST: back                 # nom du service back
      BACK_PORT: ${BACK_PORT}
      TZ: ${TZ}
    depends_on:
      back:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${GATEWAY_CPUS}"
          memory: ${GATEWAY_MEMORY}
        reservations:
          memory: ${GATEWAY_MEMORY_RESERVATION}
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - interne

  # Page HTML + JS : seul point d'entrée publié sur la machine
  front:
    build:
      context: ./Frontend
      args:
        ALPINE_VERSION: ${ALPINE_VERSION}
        PORT: ${FRONT_PORT}
    image: docker-cloud/front
    environment:
      PORT: ${FRONT_PORT}
      NODE_MAX_MEMORY: ${FRONT_NODE_MAX_MEMORY}
      GATEWAY_HOST: gateway           # nom du service gateway
      GATEWAY_PORT: ${GATEWAY_PORT}
      TZ: ${TZ}
    ports:
      - "${FRONT_PUBLISHED_PORT}:${FRONT_PORT}"   # hôte:conteneur
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${FRONT_CPUS}"
          memory: ${FRONT_MEMORY}
        reservations:
          memory: ${FRONT_MEMORY_RESERVATION}
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - public
      - interne

networks:
  # Réseau exposé : seul le front y est branché
  public:
  # Réseau privé sans accès extérieur : gateway et back n'y sont joignables que depuis le front
  interne:
    internal: true
