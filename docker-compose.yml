name: docker-cloud

services:
  # API qui renvoie la phrase
  back:
    build: ./Backend
    image: docker-cloud/back
    environment:
      PORT: 3000
      NODE_MAX_MEMORY: 128          # tas Node (Mo), sous la limite mémoire du conteneur
      PHRASE: "Hello World depuis le back !"
      TZ: Europe/Paris
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
        reservations:
          memory: 64M
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - interne

  # Passerelle d'API (nginx) : liaison front -> back, joignable seulement en interne
  gateway:
    build: ./Gateway
    image: docker-cloud/gateway
    environment:
      PORT: 80
      WORKER_PROCESSES: 1           # aligné sur la limite CPU
      WORKER_CONNECTIONS: 512
      BACK_HOST: back
      BACK_PORT: 3000
      TZ: Europe/Paris
    depends_on:
      back:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M
        reservations:
          memory: 16M
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - interne

  # Page HTML + JS : seul point d'entrée publié sur la machine
  front:
    build: ./Frontend
    image: docker-cloud/front
    environment:
      PORT: 80
      NODE_MAX_MEMORY: 128
      GATEWAY_HOST: gateway         # nom du service gateway
      GATEWAY_PORT: 80
      TZ: Europe/Paris
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
        reservations:
          memory: 64M
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - public
      - interne

networks:
  # Réseau exposé : seul le front y est branché
  public:
  # Réseau privé sans accès extérieur : gateway et back n'y sont joignables que depuis le front
  interne:
    internal: true
