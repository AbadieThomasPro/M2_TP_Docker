name: docker-cloud

services:
  # API qui renvoie la phrase
  back:
    build: ./Backend
    image: docker-cloud/back
    environment:
      PORT: 3000
      NODE_MAX_MEMORY: 128          # tas Node (Mo), sous la limite mémoire du conteneur
      PHRASE: "Hello World depuis le back !"
      TZ: Europe/Paris
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
        reservations:
          memory: 64M
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - interne

  # Page HTML + JS
  front:
    build: ./Frontend
    image: docker-cloud/front
    environment:
      PORT: 80
      NODE_MAX_MEMORY: 128
      TZ: Europe/Paris
    depends_on:
      back:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
        reservations:
          memory: 64M
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - interne

  # Reverse proxy : seul point d'entrée publié sur la machine
  proxy:
    build: ./Proxy
    image: docker-cloud/proxy
    environment:
      PORT: 80
      WORKER_PROCESSES: 1           # aligné sur la limite CPU
      WORKER_CONNECTIONS: 512
      FRONT_HOST: front
      FRONT_PORT: 80
      BACK_HOST: back
      BACK_PORT: 3000
      TZ: Europe/Paris
    ports:
      - "8080:80"
    depends_on:
      front:
        condition: service_healthy
      back:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M
        reservations:
          memory: 16M
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - public
      - interne

networks:
  # Réseau exposé : seul le proxy y est branché
  public:
  # Réseau privé sans accès extérieur : front et back n'y sont joignables que par le proxy
  interne:
    internal: true
