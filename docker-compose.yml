name: docker-cloud

# Valeurs ${...} dans .env : une seule source de configuration, aucune valeur en dur ici

services:
  back:
    build:
      context: ./Backend
      # ARG du Dockerfile alimentés par .env : même version d'Alpine pour toutes les images
      args:
        ALPINE_VERSION: ${ALPINE_VERSION}
        PORT: ${BACK_PORT}
    # Nom d'image fixe : réutilisable tel quel par Swarm, qui ignore build:
    image: docker-cloud/back
    # Surcharge des ENV au run : changer un réglage ne demande pas de rebuild
    environment:
      PORT: ${BACK_PORT}
      # Tas Node sous la limite mémoire : Node libère avant d'être tué (OOM)
      NODE_OPTIONS: --max-old-space-size=${BACK_NODE_MAX_MEMORY}
      PHRASE: ${BACK_PHRASE}
      STORAGE_DIR: ${STORAGE_DIR}
      TZ: ${TZ}
    # Volume nommé plutôt que bind mount : géré par Docker, portable (pas de chemin propre à la machine)
    # et réutilisé à chaque up, alors que le VOLUME seul créerait un volume anonyme différent à chaque fois
    volumes:
      - stockage:/data
    # Plafond pour qu'un service ne prive pas les autres de ressources ; minimum garanti en réservation
    deploy:
      resources:
        limits:
          cpus: "${BACK_CPUS}"
          memory: ${BACK_MEMORY}
        reservations:
          memory: ${BACK_MEMORY_RESERVATION}
    # 10 s : largement au-dessus du temps d'arrêt mesuré (< 1 s) avant le SIGKILL
    stop_grace_period: 10s
    # Relance après un crash, mais respecte un arrêt volontaire
    restart: unless-stopped
    # Uniquement le réseau de la gateway : le back n'est joignable ni de l'extérieur ni par le front
    networks:
      - interne-back

  gateway:
    build:
      context: ./Gateway
      args:
        ALPINE_VERSION: ${ALPINE_VERSION}
        PORT: ${GATEWAY_PORT}
    image: docker-cloud/gateway
    environment:
      PORT: ${GATEWAY_PORT}
      WORKER_PROCESSES: ${GATEWAY_WORKER_PROCESSES}   # aligné sur la limite CPU
      WORKER_CONNECTIONS: ${GATEWAY_WORKER_CONNECTIONS}
      BACK_HOST: back                 # nom du service : résolu par le DNS Docker, pas d'IP en dur
      BACK_PORT: ${BACK_PORT}         # même variable que le back : les deux restent cohérents
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      TZ: ${TZ}
    # nginx refuse de démarrer s'il ne peut pas résoudre "back" : on attend qu'il soit prêt
    depends_on:
      back:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${GATEWAY_CPUS}"
          memory: ${GATEWAY_MEMORY}
        reservations:
          memory: ${GATEWAY_MEMORY_RESERVATION}
    stop_grace_period: 10s
    restart: unless-stopped
    # Pas de ports publiés ; branchée sur les deux réseaux internes : c'est le seul pont entre front et back
    networks:
      - interne-front
      - interne-back

  front:
    build:
      context: ./Frontend
      args:
        ALPINE_VERSION: ${ALPINE_VERSION}
        PORT: ${FRONT_PORT}
    image: docker-cloud/front
    environment:
      PORT: ${FRONT_PORT}
      NODE_OPTIONS: --max-old-space-size=${FRONT_NODE_MAX_MEMORY}
      GATEWAY_HOST: gateway           # nom du service : résolu par le DNS Docker, pas d'IP en dur
      GATEWAY_PORT: ${GATEWAY_PORT}
      TZ: ${TZ}
    # Seul port publié : le front est l'unique point d'entrée
    ports:
      - "${FRONT_PUBLISHED_PORT}:${FRONT_PORT}"
    # La page n'est servie qu'une fois toute la chaîne vers l'API disponible
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${FRONT_CPUS}"
          memory: ${FRONT_MEMORY}
        reservations:
          memory: ${FRONT_MEMORY_RESERVATION}
    stop_grace_period: 10s
    restart: unless-stopped
    # public pour être joignable depuis l'hôte, interne-front pour joindre la gateway (et pas le back)
    networks:
      - public
      - interne-front

networks:
  # Seul le front y est branché : c'est le seul service qui doit être exposé
  public:
  # Deux réseaux internes plutôt qu'un : avec un seul, le front pouvait joindre back:3000 en direct
  # et contourner la gateway. Chaque service ne voit plus que ses voisins directs.
  # internal: true coupe tout accès extérieur (ni entrée depuis l'hôte, ni sortie vers Internet).
  interne-front:
    internal: true
  interne-back:
    internal: true

volumes:
  # Fichiers du cloud : seul le back y accède, ils survivent à down et aux rebuilds (supprimés par down -v)
  stockage:
