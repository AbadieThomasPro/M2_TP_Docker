# Déploiement Swarm de la stack (scalabilité). Le docker-compose.yml reste le fichier principal.
#
#   ./swarm-deploy.ps1   (Windows)   ou   ./swarm-deploy.sh   (Linux / macOS)
#
# Fichier autonome et non surcharge du compose : "docker stack deploy" utilise l'ancien format compose v3,
# qui refuse la forme longue de depends_on (condition: service_healthy) et interdit memswap_limit (testé).
# Seule la STRUCTURE est répétée : toutes les VALEURS viennent du même .env, chargé par le script
# (docker stack deploy ne lit pas le .env lui-même).
# Les images sont construites par "docker compose build" : Swarm ignore build et utilise des images existantes.
# L'autoscaler, propre au mode Swarm, est construit à part par le même script.
#
# IMAGE_TAG : version déployée. "latest" par défaut (swarm-deploy) ; le déploiement continu (ci/deploy.*)
# passe le hash git du commit testé : un tag qui change force la mise à jour progressive des services,
# et la version en service reste lisible dans "docker service ls"

services:
  back:
    image: docker-cloud/back:${IMAGE_TAG:-latest}
    environment:
      PORT: ${BACK_PORT}
      NODE_OPTIONS: --max-old-space-size=${BACK_NODE_MAX_MEMORY}
      STORAGE_DIR: ${STORAGE_DIR}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      TTL_DEFAULT_H: ${TTL_DEFAULT_H}
      TTL_MAX_H: ${TTL_MAX_H}
      STORAGE_QUOTA_MB: ${STORAGE_QUOTA_MB}
      TZ: ${TZ}
    volumes:
      - stockage:/data
    read_only: true
    # Ni stop_signal ni stop_grace_period : le signal d'arrêt vient de l'image, le délai de 10 s de Swarm suffit
    networks:
      - interne-back
    deploy:
      # Le back est sans état (expiration dans le nom des fichiers, volume partagé) : n'importe quelle
      # instance répond à tout, Swarm répartit les requêtes entre elles (adresse virtuelle du service "back").
      # Départ au minimum : c'est l'autoscaler qui ajoute des instances selon la charge mesurée.
      # Relancer swarm-deploy remet ce nombre : l'autoscaler le réajuste au relevé suivant
      replicas: ${BACK_AUTOSCALE_MIN}
      # Lus par l'autoscaler : il ne pilote que les services qui portent ces labels, entre min et max
      labels:
        autoscale.enabled: "true"
        autoscale.min: "${BACK_AUTOSCALE_MIN}"
        autoscale.max: "${BACK_AUTOSCALE_MAX}"
      # Plafond d'instances par machine : une commande "scale" excessive (ou un outil d'auto-scaling
      # externe, Swarm n'en a pas) ne peut pas multiplier le back au-delà ; le surplus reste en attente
      placement:
        max_replicas_per_node: ${BACK_MAX_REPLICAS_PER_NODE}
      # Limites PAR INSTANCE, comme dans le compose : elles protègent d'une instance qui s'emballe,
      # pas d'une multiplication des instances (5 x 0,65 CPU = 3,25 CPU)
      resources:
        limits:
          cpus: "${BACK_CPUS}"
          memory: ${BACK_MEMORY}
        # Réservations : le planificateur de Swarm ne place une instance que si la machine a encore
        # ces ressources disponibles ; sinon elle reste "Pending" au lieu d'étouffer les autres services
        reservations:
          cpus: "${BACK_CPUS_RESERVATION}"
          memory: ${BACK_MEMORY_RESERVATION}
      # Remplace "restart: unless-stopped", ignoré par Swarm : une tâche qui échoue est recréée
      restart_policy:
        condition: on-failure
        delay: 2s
      # Mise à jour progressive : une tâche à la fois, la nouvelle doit être healthy avant l'arrêt
      # de l'ancienne (start-first), donc aucune coupure ; retour arrière automatique en cas d'échec.
      # monitor 30 s : Swarm surveille chaque nouvelle tâche le temps que son healthcheck puisse
      # échouer (3 essais toutes les 10 s) ; une version qui tombe dans ce délai est annulée
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s

  cleaner:
    image: docker-cloud/cleaner:${IMAGE_TAG:-latest}
    environment:
      STORAGE_DIR: ${STORAGE_DIR}
      CLEANUP_INTERVAL_S: ${CLEANUP_INTERVAL_S}
      INCOMING_MAX_AGE_MIN: ${INCOMING_MAX_AGE_MIN}
    volumes:
      - stockage:/data
      # tmpfs en syntaxe longue : seule forme acceptée par Swarm (taille en octets : 1 Mo)
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1048576
    read_only: true
    # network_mode: none n'existe pas en Swarm : le worker rejoint "isole", un réseau interne
    # dont il est le seul membre. Même effet : il ne peut joindre personne, ni Internet
    networks:
      - isole
    deploy:
      # Toujours UN seul worker : plusieurs supprimeraient les mêmes fichiers en même temps
      replicas: 1
      resources:
        limits:
          cpus: "${CLEANER_CPUS}"
          memory: ${CLEANER_MEMORY}
        reservations:
          cpus: "${CLEANER_CPUS_RESERVATION}"
          memory: ${CLEANER_MEMORY_RESERVATION}
      restart_policy:
        condition: on-failure
        delay: 2s
      # stop-first (et non start-first) : l'ancien worker s'arrête avant que le nouveau démarre,
      # il n'y en a jamais deux à la fois. Retour arrière si la nouvelle version ne tient pas
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s

  gateway:
    image: docker-cloud/gateway:${IMAGE_TAG:-latest}
    environment:
      PORT: ${GATEWAY_PORT}
      WORKER_PROCESSES: ${GATEWAY_WORKER_PROCESSES}
      WORKER_CONNECTIONS: ${GATEWAY_WORKER_CONNECTIONS}
      BACK_HOST: back
      BACK_PORT: ${BACK_PORT}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      TZ: ${TZ}
    volumes:
      # Config générée, PID et fichiers temporaires de nginx (8 Mo, compté dans sa mémoire)
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 8388608
    read_only: true
    # Tampons TCP plafonnés, comme dans le compose (justification dans le .env)
    sysctls:
      net.ipv4.tcp_rmem: "4096 131072 ${TCP_BUFFER_MAX_BYTES}"
      net.ipv4.tcp_wmem: "4096 16384 ${TCP_BUFFER_MAX_BYTES}"
    networks:
      - interne-front
      - interne-back
    deploy:
      # Goulot mesuré dès 3 back : elle aussi est multipliée par l'autoscaler. Sans état, et le front
      # la joint par l'adresse virtuelle du service "gateway" : rien à changer pour ajouter une instance
      replicas: ${GATEWAY_AUTOSCALE_MIN}
      labels:
        autoscale.enabled: "true"
        autoscale.min: "${GATEWAY_AUTOSCALE_MIN}"
        autoscale.max: "${GATEWAY_AUTOSCALE_MAX}"
      resources:
        limits:
          # Plus que dans le compose (0,10) : elle relaie le trafic de 3 back (rapport de coûts 7 / 3 / 1)
          cpus: "${SWARM_GATEWAY_CPUS}"
          # 96 Mo et non 48 comme dans le compose : 98 % de 48 Mo mesurés pour 10 envois de 40 Mo en parallèle
          memory: ${SWARM_GATEWAY_MEMORY}
        reservations:
          cpus: "${GATEWAY_CPUS_RESERVATION}"
          memory: ${GATEWAY_MEMORY_RESERVATION}
      restart_policy:
        condition: on-failure
        delay: 2s
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s

  front:
    image: docker-cloud/front:${IMAGE_TAG:-latest}
    environment:
      PORT: ${FRONT_PORT}
      NODE_OPTIONS: --max-old-space-size=${FRONT_NODE_MAX_MEMORY}
      GATEWAY_HOST: gateway
      GATEWAY_PORT: ${GATEWAY_PORT}
      TZ: ${TZ}
    # Publication par le "routing mesh" de Swarm : le port 8080 de l'hôte mène au service front
    ports:
      - "${FRONT_PUBLISHED_PORT}:${FRONT_PORT}"
    read_only: true
    # Tampons TCP plafonnés : sans ça, 20 envois simultanés faisaient tuer le front (OOM, mesuré)
    sysctls:
      net.ipv4.tcp_rmem: "4096 131072 ${TCP_BUFFER_MAX_BYTES}"
      net.ipv4.tcp_wmem: "4096 16384 ${TCP_BUFFER_MAX_BYTES}"
    networks:
      - public
      - interne-front
    deploy:
      # Le routing mesh répartit les connexions du port 8080 entre les instances du front
      replicas: ${FRONT_AUTOSCALE_MIN}
      labels:
        autoscale.enabled: "true"
        autoscale.min: "${FRONT_AUTOSCALE_MIN}"
        autoscale.max: "${FRONT_AUTOSCALE_MAX}"
      resources:
        limits:
          # Plus que dans le compose (0,25) : sinon le front devient le goulot dès 3 back (mesuré)
          cpus: "${SWARM_FRONT_CPUS}"
          memory: ${FRONT_MEMORY}
        reservations:
          cpus: "${FRONT_CPUS_RESERVATION}"
          memory: ${FRONT_MEMORY_RESERVATION}
      restart_policy:
        condition: on-failure
        delay: 2s
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s

  # Swarm n'a pas d'autoscaling : ce service ajoute ou retire des instances selon le CPU et la mémoire
  autoscaler:
    image: docker-cloud/autoscaler:${IMAGE_TAG:-latest}
    # Seuils et délais : valeurs justifiées dans le .env (section Autoscaling)
    environment:
      AUTOSCALE_INTERVAL_S: ${AUTOSCALE_INTERVAL_S}
      AUTOSCALE_CPU_UP: ${AUTOSCALE_CPU_UP}
      AUTOSCALE_CPU_DOWN: ${AUTOSCALE_CPU_DOWN}
      AUTOSCALE_MEM_UP: ${AUTOSCALE_MEM_UP}
      AUTOSCALE_MEM_DOWN: ${AUTOSCALE_MEM_DOWN}
      AUTOSCALE_UP_SAMPLES: ${AUTOSCALE_UP_SAMPLES}
      AUTOSCALE_DOWN_SAMPLES: ${AUTOSCALE_DOWN_SAMPLES}
      AUTOSCALE_COOLDOWN_UP_S: ${AUTOSCALE_COOLDOWN_UP_S}
      AUTOSCALE_COOLDOWN_DOWN_S: ${AUTOSCALE_COOLDOWN_DOWN_S}
      AUTOSCALE_HOST_BUDGET_PCT: ${AUTOSCALE_HOST_BUDGET_PCT}
    volumes:
      # Le socket est le seul accès au moteur, et il équivaut à root sur l'hôte : risque assumé et réduit
      # (seul montage, aucun réseau, lecture seule, utilisateur non-root). Un ":ro" serait trompeur :
      # il empêche de modifier le fichier, pas d'envoyer des commandes à Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Heartbeat, relevé courant et config du client docker (1 Mo, compté dans sa mémoire)
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1048576
    read_only: true
    # Son propre réseau interne, sans autre membre : il ne parle qu'au moteur, par le socket (un fichier,
    # pas le réseau). Distinct de "isole" : le cleaner et lui n'ont aucune raison de se joindre
    networks:
      - isole-autoscaler
    deploy:
      # Une seule instance : deux autoscalers prendraient des décisions contradictoires.
      # Pas de labels autoscale : il ne se pilote pas lui-même (pas plus que le cleaner)
      replicas: 1
      # Seul un manager accepte "docker service scale" ; sur un worker il ne pourrait rien faire
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "${AUTOSCALER_CPUS}"
          memory: ${AUTOSCALER_MEMORY}
        reservations:
          cpus: "${AUTOSCALER_CPUS_RESERVATION}"
          memory: ${AUTOSCALER_MEMORY_RESERVATION}
      # Il sort en erreur si le socket est inaccessible : Swarm le relance, avec un délai pour ne pas boucler
      restart_policy:
        condition: on-failure
        delay: 10s
      # stop-first : jamais deux autoscalers en même temps (décisions contradictoires)
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s

# Mêmes réseaux que le compose, en "overlay" : le type de réseau de Swarm, qui peut s'étendre sur
# plusieurs machines. Les réseaux internes restent sans accès extérieur
networks:
  public:
    driver: overlay
  interne-front:
    driver: overlay
    internal: true
  interne-back:
    driver: overlay
    internal: true
  # Remplace network_mode: none pour le cleaner
  isole:
    driver: overlay
    internal: true
  # Même principe pour l'autoscaler
  isole-autoscaler:
    driver: overlay
    internal: true

volumes:
  # Volume propre à la stack ("cloud_stockage"), distinct de celui du compose ("docker-cloud_stockage")
  stockage:
